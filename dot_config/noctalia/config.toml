[shell]
avatar_path = "/home/markus/nas/home/onedrive/mrksr/avatar_lemming_upscayled_4x.png"
font_family = "Liberation Sans"
button_borders = false
input_borders = false
card_borders = false
popup_borders = false
clipboard_enabled = false
clipboard_auto_paste = "off"

[shell.animation]
speed = 1.25

[shell.panel]
transparency_mode = "soft"
launcher_placement = "attached"
clipboard_placement = "attached"
polkit_placement = "attached"

[shell.launcher]
pinned = [
  "io.element.Element",
  "zen-browser-twilight",
  "chrome-mpoampnhehaaibinfnfeeblpclklpjko-Default",
  "chromium",
  "steam",
]

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "2"

[[shell.session.actions]]
action = "reboot"
shortcut = "3"

[[shell.session.actions]]
action = "logout"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"

[[shell.session.actions]]
action = "command"
command = "systemctl reboot --firmware-setup"
label = "Reboot to UEFI"
glyph = "settings"
shortcut = "6"

[lockscreen]
blur_intensity = 0.0
tint_intensity = 0.0

[location]
address = "traunstein"

[calendar]
enabled = true

[nightlight]
enabled = true
temperature_night = 4501

[brightness]
enable_ddcutil = true

[battery]
warning_threshold = 20

[system.monitor]
cpu_usage_activity_threshold = 80.0
cpu_temp_activity_threshold = 80.0
cpu_temp_critical_threshold = 90.0
gpu_usage_activity_threshold = 80.0
gpu_usage_critical_threshold = 90.0
gpu_temp_activity_threshold = 80.0
gpu_temp_critical_threshold = 90.0
ram_pct_activity_threshold = 80.0
swap_pct_activity_threshold = 80.0
swap_pct_critical_threshold = 90.0

[notification]
keep_dismissed_in_history = false

[hot_corners]
enabled = true

[hot_corners.top_right]
action = "panel-toggle control-center"

[plugins]
enabled = ["noctalia/screen_recorder"]

[plugin_settings."noctalia/screen_recorder"]
video_codec = "hevc"
video_bitrate_mode = "vbr"
copy_to_clipboard = true

[wallpaper]
directory = "/home/markus/Pictures/Wallpapers"
fill_color = "#000000"
transition = ["fade", "disc", "stripes", "wipe", "pixelate", "honeycomb"]
edge_smoothness = 0.05

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[widget.clock]
type = "clock"
format = "{:%a %d %b, %H:%M}"
vertical_format = "{:%H\n%M}"
tooltip_format = "{:%a %d %b, %H:%M}"

[widget.media]
type = "media"
artist_first = true
max_length = 300.0
title_scroll = "on_hover"
hide_when_no_media = true

[widget.workspaces]
type = "workspaces"
max_label_chars = 2
pill_scale = 0.6
labels_only_when_occupied = true

[widget.active_window]
type = "active_window"
max_length = 300.0
title_scroll = "on_hover"

[widget.tray]
type = "tray"
hidden = ["nm-applet"]
hide_passive = false

[widget.battery]
type = "battery"
display_mode = "graphic"

[widget.privacy]
type = "privacy"
hide_inactive = true

[bar.default]
start = ["workspaces", "active_window"]
center = ["clock", "media"]
end = [
  "tray",
  "nightlight",
  "battery",
  "bluetooth",
  "kenn/keybind-cheatsheet:keybinds",
  "privacy",
  "noctalia/screen_recorder:recorder",
  "volume",
  "brightness",
  "control-center",
]
