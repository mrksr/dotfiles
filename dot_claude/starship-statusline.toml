"$schema" = 'https://starship.rs/config-schema.json'

# Claude Code statusLine config, rendered by statusline-command.sh via
# `starship statusline claude-code` (the profile below). Styled as one
# continuous powerline chain like ~/.config/starship.toml's interactive
# prompt: orange host → yellow dir → aqua git → blue model → grey session
# stats. statusline-command.sh appends the rate-limit segments (still on
# color_bg3) and the closing cap.
# Starship has no config include mechanism, so the shared sections are
# duplicated here — keep them in sync if the main prompt's styling changes.

add_newline = false
palette = 'gruvbox_dark'

[profiles]
claude-code = """
[](color_orange)\
$os\
$username\
$hostname\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
$git_metrics\
[](fg:color_aqua bg:color_blue)\
$claude_model\
[](fg:color_blue bg:color_bg3)\
$claude_context\
$claude_cost\
${custom.claude_email}\
"""

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'
# Bright variants: readable as foreground on the color_bg3 segment.
color_bright_green = '#b8bb26'
color_bright_yellow = '#fabd2f'
color_bright_red = '#fb4934'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = "[ $symbol]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bold bg:color_orange fg:color_bg1"
format = '[ $user]($style)'

[hostname]
ssh_only = false
ssh_symbol = " 󱘖"
style = "bg:color_orange fg:color_fg0"
format = "[@$hostname$ssh_symbol ]($style)"

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[git_metrics]
disabled = false
added_style = "bg:color_aqua fg:color_fg0"
deleted_style = "bg:color_aqua fg:color_fg0"
only_nonzero_diffs = true
format = '([+$added ]($added_style)[-$deleted ]($deleted_style))'

[claude_model]
symbol = "󰚩"
style = "bg:color_blue fg:color_fg0"
format = '[ $symbol $model ]($style)'

# Gauge hidden below 30%, then green/yellow/red like the built-in defaults.
[claude_context]
format = '[ $gauge $percentage ]($style)'

[[claude_context.display]]
threshold = 0.0
style = "bold bg:color_bg3 fg:color_bright_green"
hidden = true

[[claude_context.display]]
threshold = 30.0
style = "bold bg:color_bg3 fg:color_bright_green"
hidden = false

[[claude_context.display]]
threshold = 60.0
style = "bold bg:color_bg3 fg:color_bright_yellow"
hidden = false

[[claude_context.display]]
threshold = 80.0
style = "bold bg:color_bg3 fg:color_bright_red"
hidden = false

# Hidden below $1, then yellow, then red from $5.
[claude_cost]
symbol = "󰇁"
format = '[ $symbol$cost ]($style)'

[[claude_cost.display]]
threshold = 0.0
style = "bold bg:color_bg3 fg:color_bright_yellow"
hidden = true

[[claude_cost.display]]
threshold = 1.0
style = "bold bg:color_bg3 fg:color_bright_yellow"
hidden = false

[[claude_cost.display]]
threshold = 5.0
style = "bold bg:color_bg3 fg:color_bright_red"
hidden = false

# `claude auth status` honours CLAUDE_CONFIG_DIR, so this shows the account
# of whichever config dir the session runs with.
[custom.claude_email]
command = 'claude auth status 2>/dev/null | jq -r ".email // empty"'
when = true
shell = ['bash', '--noprofile', '--norc']
symbol = "󰇮"
style = "bg:color_bg3 fg:color_fg0"
format = '[ $symbol $output ]($style)'
